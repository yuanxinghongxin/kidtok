services:
  kidtok:
    image: burukkux/kidtok:latest
    container_name: kidtok
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      QIMENG_SERVER_ADDR: ":8080"
      # 饭太硬影视源接口（必填）
      QIMENG_FANTAIYING_URL: "http://www.饭太硬.cc/tv"
      # 自建 AList 网盘
      QIMENG_ALIST_URL: "http://192.168.0.10:5244"
      QIMENG_ALIST_USERNAME: "admin"
      QIMENG_ALIST_PASSWORD: "change-me"
      TZ: Asia/Shanghai
    volumes:
      # 存 config.json（前端「服务器配置」保存的内容），删除容器不丢配置
      - ./data:/data
